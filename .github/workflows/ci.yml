# Test, scan, version and publish the mcp-wordpress-oauth image.
#
#   pull request -> tests + repo scan + integration stack + image build/scan/smoke test
#                   (nothing published)
#   push to main -> the same, then: push image, tag vX.Y.Z, create release;
#                   independently, tag mcp-bearer-auth-vX.Y.Z and release the
#                   WordPress plugin zip when the plugin changed
#
# Publishing happens only after every gate passed, and it pushes the very
# image that was scanned and smoke-tested (no rebuild). See docs/ci.md and
# docs/decisions.md D11/D13.
#
# Third-party actions are pinned to full commit SHAs (tags can be moved;
# there have been tag-hijacking incidents with popular actions).

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Server version bump (auto = from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      plugin_bump:
        description: "WordPress plugin version bump (auto = from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

# Releases on main run strictly one after another, so two pushes can never
# compute the same next version. PR runs cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Override with repository variables, e.g. for a Gitea/Harbor registry.
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  TRIVY_VERSION: v0.75.0

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools-scm derives the version from tags
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test suite
        run: pytest -q
      - name: Check test-stack scripts
        if: matrix.python == '3.12'
        run: |
          sh -n test-stack/init/prepare.sh
          sh -n test-stack/wordpress/wp-setup.sh
          python -m py_compile test-stack/e2e.py

  scan-repo:
    name: Trivy (repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Secrets committed by mistake, and misconfigurations (Dockerfile,
      # compose). Package vulnerabilities are checked on the built image,
      # which has the exact resolved dependency versions.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  # The WordPress plugin (wordpress-plugin/mcp-bearer-auth): unit tests on
  # the lowest and newest supported PHP, coding standards, and the
  # installable zip (with vendor/, without dev dependencies or tests, and
  # the plugin's own version in its header).
  plugin:
    name: Plugin (PHP ${{ matrix.php }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.4"]
    defaults:
      run:
        working-directory: wordpress-plugin/mcp-bearer-auth
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Unit tests
        run: composer test
      - name: Coding standards
        if: matrix.php == '8.4'
        run: composer phpcs
      - name: Build zip
        if: matrix.php == '8.1'
        env:
          # Release versions only for zips that main will publish.
          PLUGIN_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.version.outputs.plugin_release == 'true' }}
          PLUGIN_VERSION: ${{ needs.version.outputs.plugin_version }}
        run: |
          rm -rf vendor && composer install --no-dev --no-interaction --no-progress --optimize-autoloader
          mkdir -p "$RUNNER_TEMP/zip/mcp-bearer-auth"
          cp -r mcp-bearer-auth.php README.md readme.txt src vendor "$RUNNER_TEMP/zip/mcp-bearer-auth/"
          # Release version, or a dev version every release updates over.
          if [[ "$PLUGIN_RELEASE" == "true" ]]; then version="$PLUGIN_VERSION"; else version="${PLUGIN_VERSION:-0.0.0}-dev.${GITHUB_SHA::7}"; fi
          header="$RUNNER_TEMP/zip/mcp-bearer-auth/mcp-bearer-auth.php"
          readme="$RUNNER_TEMP/zip/mcp-bearer-auth/readme.txt"
          sed -i -E "s/^( \* Version: +).*/\1$version/" "$header"
          sed -i -E "s/^(Stable tag: +).*/\1$version/" "$readme"
          grep -qE "^ \* Version: +$version\$" "$header" || { echo "Version header not stamped"; exit 1; }
          grep -qE "^Stable tag: +$version\$" "$readme" || { echo "readme.txt Stable tag not stamped"; exit 1; }
          echo "Plugin version $version"
          (cd "$RUNNER_TEMP/zip" && zip -qr "$GITHUB_WORKSPACE/mcp-bearer-auth.zip" mcp-bearer-auth)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.php == '8.1'
        with:
          name: mcp-bearer-auth
          path: mcp-bearer-auth.zip
          if-no-files-found: error

  # The real chain: Keycloak tokens, WordPress 6.9's Abilities API with the
  # MCP Bearer Auth plugin from this repository, and the full
  # AUTH_MODE=wordpress OAuth flow through wp-login.php and
  # authorize-application.php. Self-contained: no other repository needed.
  integration:
    name: Integration (AUTH_MODE=${{ matrix.auth_mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth_mode: [resource, wordpress]
    env:
      E2E_MODE: ${{ matrix.auth_mode }}
      COMPOSE: docker compose -f test-stack/docker-compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: $COMPOSE build
      # `run` starts the stack and waits for its healthchecks first.
      - name: End-to-end checks
        run: $COMPOSE run --rm e2e
      - name: Logs
        if: always()
        run: |
          $COMPOSE logs --no-color --tail 200 keycloak bearer-plugin wp-setup wordpress mcp-resource mcp-wp
          $COMPOSE exec -T wordpress tail -n 100 /var/www/html/wp-content/debug.log || true
      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      release: ${{ steps.next.outputs.release }}
      previous: ${{ steps.next.outputs.previous }}
      plugin_version: ${{ steps.plugin.outputs.version }}
      plugin_tag: ${{ steps.plugin.outputs.tag }}
      plugin_release: ${{ steps.plugin.outputs.release }}
      plugin_previous: ${{ steps.plugin.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: next
        run: python3 scripts/next_version.py --component server --bump "${{ inputs.bump || 'auto' }}"
      - id: plugin
        run: python3 scripts/next_version.py --component plugin --bump "${{ inputs.plugin_bump || 'auto' }}"

  image:
    name: Build, scan, publish
    needs: [test, scan-repo, plugin, integration, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the vX.Y.Z tag and release
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide what this run publishes
        id: plan
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"  # registries require lowercase
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" && "$RELEASE" == "true" ]]; then
            publish=true
            build_version="$VERSION"
          else
            publish=false
            # PEP 440 dev version, so a non-release image can't pass for a release.
            build_version="${VERSION:-0.0.0}.dev0+g${GITHUB_SHA::7}"
          fi
          {
            echo "image=$image"
            echo "publish=$publish"
            echo "build_version=$build_version"
          } >> "$GITHUB_OUTPUT"
          echo "image=$image publish=$publish version=$build_version"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.plan.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }},enable=${{ steps.plan.outputs.publish }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }},enable=${{ steps.plan.outputs.publish }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }},enable=${{ steps.plan.outputs.publish == 'true' && !startsWith(needs.version.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ steps.plan.outputs.publish }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.build_version }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once into the local Docker daemon. Everything below (scan,
      # smoke test, push) uses this one image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: VERSION=${{ steps.plan.outputs.build_version }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            mcp-wordpress-oauth:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # A cache backend problem (e.g. on Gitea runners) must not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Trivy (image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: mcp-wordpress-oauth:ci
          scanners: vuln,secret
          vuln-type: os,library
          severity: HIGH,CRITICAL
          # Fail on what can be fixed (by a base image update or a dependency
          # bump); unfixed CVEs would block every release with no remedy.
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OIDC_ISSUER=https://sso.example.com/realms/wp \
            -e OIDC_JWKS_URI=https://sso.example.com/realms/wp/protocol/openid-connect/certs \
            -e BASE_URL=http://localhost:8000 \
            -e WORDPRESS_URL=https://wp.example.com \
            mcp-wordpress-oauth:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz | grep -qx ok
          # Unauthenticated MCP request must be refused, pointing at the metadata.
          headers=$(curl -s -D - -o /dev/null -X POST http://localhost:8000/mcp \
            -H 'Accept: application/json, text/event-stream' -H 'Content-Type: application/json' -d '{}')
          echo "$headers" | head -1 | grep -q ' 401'
          echo "$headers" | grep -qi '^www-authenticate:.*resource_metadata='
          curl -fsS http://localhost:8000/.well-known/oauth-protected-resource/mcp | grep -q sso.example.com
          # The image reports the version it was built with.
          docker exec smoke python -c "import mcp_wordpress; print(mcp_wordpress.__version__)" \
            | grep -qx "${{ steps.plan.outputs.build_version }}"
          # Runs as the unprivileged user.
          test "$(docker exec smoke id -u)" = 10001

          # AUTH_MODE=wordpress: its own authorization server, no DCR by
          # default, state written to the /data volume as uid 10001.
          docker run -d --name smoke-wp -p 8001:8000 \
            -e AUTH_MODE=wordpress \
            -e BASE_URL=http://localhost:8001 \
            -e WORDPRESS_URL=https://wp.example.com \
            -e OAUTH_JWT_SIGNING_KEY="$(openssl rand -base64 48)" \
            -e OAUTH_STORAGE_KEY="$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" \
            mcp-wordpress-oauth:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8001/healthz && break
            sleep 1
          done
          metadata=$(curl -fsS http://localhost:8001/.well-known/oauth-authorization-server)
          echo "$metadata"
          echo "$metadata" | grep -q '"authorization_endpoint":"http://localhost:8001/authorize"'
          echo "$metadata" | grep -q '"revocation_endpoint"'
          ! echo "$metadata" | grep -q registration_endpoint
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8001/register \
            -H 'Content-Type: application/json' -d '{"redirect_uris":["http://localhost/cb"]}')
          test "$status" = 404 -o "$status" = 405
          test "$(docker exec smoke-wp id -u)" = 10001
      - name: Smoke test logs
        if: always()
        run: |
          docker logs smoke 2>&1 | tail -50 || true
          docker logs smoke-wp 2>&1 | tail -50 || true

      # ── Everything above passed. Publish (main + release only). ──────────
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        if: steps.plan.outputs.publish == 'true'
        run: docker push --all-tags "${{ steps.plan.outputs.image }}"

      # The tag is created only after a successful push, so a failed run never
      # consumes a version number.
      - name: Tag release
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # The repository's "Latest" release is always the server's; the plugin
      # updater looks for its own tags (D14).
      - name: GitHub release
        if: steps.plan.outputs.publish == 'true' && github.server_url == 'https://github.com'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          IMAGE: ${{ steps.plan.outputs.image }}
        run: |
          gh release create "$TAG" --title "$TAG" --latest --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} \
            --notes "Image: \`$IMAGE:${TAG#v}\`. The WordPress plugin (MCP Bearer Auth) has its own releases, tagged mcp-bearer-auth-v*."

  # The WordPress plugin, versioned on its own (D11): released when commits
  # touched wordpress-plugin/mcp-bearer-auth/, after the same gates as the
  # image. Sites with the plugin pick it up through WordPress' updater (D14).
  plugin-release:
    name: Release WordPress plugin
    needs: [test, scan-repo, plugin, integration, version]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      && needs.version.outputs.plugin_release == 'true' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the mcp-bearer-auth-vX.Y.Z tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-bearer-auth
          path: ${{ runner.temp }}/plugin

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.plugin_tag }}
          VERSION: ${{ needs.version.outputs.plugin_version }}
          PREVIOUS: ${{ needs.version.outputs.plugin_previous }}
        run: |
          zip="$RUNNER_TEMP/plugin/mcp-bearer-auth.zip"
          unzip -p "$zip" mcp-bearer-auth/mcp-bearer-auth.php | grep -qE "^ \* Version: +$VERSION\$" \
            || { echo "The zip's header doesn't say $VERSION"; exit 1; }
          # The release's readme.txt is the zip's: WordPress shows its
          # requirements and sections before updating (D14).
          unzip -p "$zip" mcp-bearer-auth/readme.txt > "$RUNNER_TEMP/readme.txt"
          grep -qE "^Stable tag: +$VERSION\$" "$RUNNER_TEMP/readme.txt" || { echo "readme.txt doesn't say $VERSION"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "MCP Bearer Auth $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" --title "MCP Bearer Auth $VERSION" --latest=false \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} \
            --notes "WordPress plugin for AUTH_MODE=resource/proxy. Install mcp-bearer-auth.zip once (Plugins → Add New → Upload); later versions arrive through WordPress' updates." \
            "$zip" "$RUNNER_TEMP/readme.txt"
